name: Calidad del código

# ESLint para el JavaScript de la página y revisión de sintaxis del Python.
# Sin credenciales, con permisos mínimos y sin ejecutar scripts de instalación de npm.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # npm ci instala exactamente lo del package-lock.json; --ignore-scripts evita
      # que un paquete ejecute código al instalarse.
      - name: Instalar dependencias de desarrollo
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

  python:
    name: Sintaxis de Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Comprobar que todo el Python compila
        run: python -m compileall -q functions scripts
