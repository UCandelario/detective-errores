name: Revisión de secretos

# Busca patrones de secretos solo en las líneas que añade el pull request.
# No imprime el valor encontrado. Sin credenciales y con permisos mínimos.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos en el cambio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Revisar el cambio
        env:
          RAMA_BASE: ${{ github.base_ref }}
        run: python scripts/revisar_secretos.py --base "origin/$RAMA_BASE"
